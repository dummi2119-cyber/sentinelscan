{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="card auth-card">
    <a class="brand" href="/"><span class="logo">S</span> SentinelScan</a>
    <h2 class="center" style="margin-bottom:6px">Welcome back</h2>
    <p class="center mut" style="margin-bottom:22px">Log in to your scanning console</p>
    {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      {% if csrf %}<input type="hidden" name="csrf_token" value="{{ csrf }}">{% endif %}
      <div class="field">
        <label>Email</label>
        <input class="input" type="email" name="email" value="{{ email|default('',true) }}" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input class="input" type="password" name="password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <div class="divider-label">New here?</div>
    <a class="btn btn-ghost btn-block" href="/register">Create a free account</a>
    <p class="center small faint" style="margin-top:18px">Admin? <a href="/admin/login">Admin login &rarr;</a></p>
  </div>
</div>
{% endblock %}
